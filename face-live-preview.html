<main><span class="badge">独立预览 · 未替换游戏人物</span><h1>原始脸 · 动态与换妆试制</h1><p>同一张原始脸，检查眨眼、视线、眉毛、微笑与说话；妆容随眼睑和口型更新。</p>
<div class="layout"><div class="stage"><div class="views"><div class="view"><span>原始母图</span><canvas id="reference" width="1000" height="1100"></canvas></div><div class="view"><span>动态试制</span><canvas id="face" width="1000" height="1100"></canvas></div></div><div class="row"><button id="blink">眨一下眼</button><button id="sample">播放测试语音</button><button id="stop">停止语音</button><button id="reset">恢复原始状态</button></div><div id="status">正在载入局部素材…</div><small>当前是独立局部贴图动画原型。PSD2Live 自动绑定与导出为另一项验证，不把本页称作已完成的 Cubism 模型。换妆试验为唇色替换及眼影、腮红叠加，尚未制作完整卸妆底图。</small></div>
<aside class="controls"><section><h2>动作</h2><label>自动眨眼<input id="autoBlink" type="checkbox"></label><label>眼睛开合<input id="eye" type="range" min="0" max="1" step=".01" value="1"></label><label>视线左右<input id="gazeX" type="range" min="-1" max="1" step=".01" value="0"></label><label>视线上下<input id="gazeY" type="range" min="-1" max="1" step=".01" value="0"></label><label>视线跟随鼠标<input id="follow" type="checkbox"></label><label>抬眉<input id="brow" type="range" min="0" max="1" step=".01" value="0"></label><label>微笑<input id="smile" type="range" min="0" max="1" step=".01" value="0"></label><label>口型<select id="mouth"><option value="original">闭口</option><option value="mouth-open">张口</option><option value="mouth-round">圆口</option></select></label></section>
<section><h2>独立妆容</h2><div class="row"><button data-preset="original">原妆</button><button data-preset="daily">暖茶</button><button data-preset="rose">玫瑰</button></div><label>唇色<input id="lip" type="color" value="#a43c54"></label><label>唇色浓度<input id="lipAmount" type="range" min="0" max="1" step=".01" value="0"></label><label>腮红叠加<input id="blush" type="range" min="0" max="1" step=".01" value="0"></label><label>眼影叠加<input id="shadow" type="range" min="0" max="1" step=".01" value="0"></label><small>原妆可精确复位。唇色遮罩按口型分别准备；眼影随眼睑状态改变位置。</small></section></aside></div>
