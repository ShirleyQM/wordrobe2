<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学院衣橱 · 素材试衣间</title><link rel="stylesheet" href="studio.css"></head><body><header><a href="../print-studio/index.html">← 印花试衣</a><h1>素材试衣间</h1><button id="export-png">下载单件</button></header><main><section class="fitting"><div class="viewbar"><div class="segments"><button data-view="full" class="active">全身</button><button data-view="detail">细节</button></div><div class="segments"><button data-bg="light" class="active" aria-label="浅色背景">浅底</button><button data-bg="dark" aria-label="深色背景">深底</button></div></div><div id="stage" tabindex="0" aria-label="服装试穿与顶点编辑画布"><svg id="stage-svg" viewBox="0 0 939 1676" xmlns="http://www.w3.org/2000/svg"><image id="scene" x="0" y="0" width="939" height="1676"/><g id="editor"></g></svg></div><div class="editbar"><button data-tool="view" class="active">试穿</button><button data-tool="mesh">网格变形</button><button data-tool="curve">轮廓曲线</button><button id="add-node" hidden>增点</button></div></section><aside><div id="items" class="items"></div><div class="tools"><label><input type="checkbox" id="symmetry" checked> 左右对称</label><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="reset">还原本件</button></div><p id="hint">选择一件素材开始调整。</p><div class="options"><label><input type="checkbox" id="tucked" checked> 上衣扎入裙腰</label><label><input type="checkbox" id="lineart">线稿</label></div><div class="exports"><button id="save">导出调整</button><label class="file-button">导入调整<input id="import" type="file" accept="application/json,.json"></label><button id="export-look">下载试穿图</button></div><p class="save-state" id="save-state" role="status">调整自动保存在当前浏览器</p></aside></main><div id="toast" role="status"></div><script src="curve.js"></script><script src="mesh.js"></script><script src="studio.js"></script></body></html>
