<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学院衣橱 · 素材试衣间</title><link rel="stylesheet" href="studio.css"><style>body.embedded>header{display:none}body.embedded main{padding-top:12px}</style><link rel="stylesheet" href="../preview-camera.css"><link rel="stylesheet" href="embedded-layout.css"></head><body><header><a href="../print-studio/index.html">← 印花试衣</a><h1>素材试衣间</h1><button id="export-png">下载单件</button></header><main><section class="fitting"><div class="viewbar"><div class="segments"><button data-view="full" class="active">全身</button><button data-view="detail">衣服细节</button></div><div class="segments"><button data-bg="light" class="active" aria-label="浅色背景">浅底</button><button data-bg="dark" aria-label="深色背景">深底</button></div><div class="regeneration-actions"><button id="garment-notes">衣服备注</button><button id="save-fitting">保存</button><button id="regenerate">重新生成</button><button id="regenerate-cancel" hidden>恢复旧版</button></div></div><div id="stage" tabindex="0" aria-label="服装试穿与顶点编辑画布"><svg id="stage-svg" viewBox="0 0 939 1676" xmlns="http://www.w3.org/2000/svg"><image id="scene" x="0" y="0" width="939" height="1676"/><g id="editor"></g></svg></div><div id="shoe-sides" class="segments" hidden><button data-shoe-side="0" aria-pressed="true">画面左鞋</button><button data-shoe-side="1" aria-pressed="false">画面右鞋</button></div><div id="eraser-controls" class="eraser-controls" hidden><label>大小 <input id="eraser-size" type="range" min="2" max="100" step="1" value="18" aria-label="橡皮擦大小"><output id="eraser-size-value">18</output></label><select id="eraser-layer" aria-label="擦除范围"><option value="both">前后片一起擦</option><option value="front">只擦前片</option><option value="back">只擦后片</option></select><button id="restore-erased">恢复本件擦除</button></div><div class="editbar"><button data-tool="view" class="active">试穿</button><button id="edit-shape" aria-pressed="false">修版型</button><button data-tool="mesh">网格编辑</button><button data-tool="transform">移动 / 缩放</button><button data-tool="rotate">旋转</button><label id="free-scale-wrap" hidden><input id="free-scale" type="checkbox">自由比例</label><button data-tool="opening" hidden>领口 / 腰口</button><button id="opening-before" hidden>处理前</button><button id="opening-add" hidden>＋开口</button><button id="opening-remove" hidden>删开口</button><label id="opening-rise-wrap" hidden>后片高度 <input id="opening-rise" type="number" min="0" max="300" step="1" value="30" aria-label="开口后片高度"></label><button id="add-node" hidden>添加节点</button></div></section><aside><select id="fit-category" aria-label="修版单品分类" hidden></select><div id="items" class="items"></div><div class="tools"><label><input type="checkbox" id="symmetry" checked> 左右对称</label><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="reset">还原本件</button></div><p id="hint">选择一件素材开始调整。</p><div class="options"><label><input type="checkbox" id="tucked" checked> 上衣扎入裙腰</label><label><input type="checkbox" id="lineart">线稿</label></div><div class="exports"><button id="save">导出调整</button><label class="file-button">导入调整<input id="import" type="file" accept="application/json,.json"></label><button id="export-look">下载试穿图</button><button id="export-front">下载前片</button><button id="export-back">下载后片</button></div><p id="regeneration-status" role="status" hidden></p><p class="save-state" id="save-state" role="status">调整自动保存在当前浏览器</p></aside></main><dialog id="garment-notes-dialog" aria-labelledby="notes-title"><div class="notes-heading"><h2 id="notes-title">衣服备注</h2><button id="close-notes" aria-label="关闭衣服备注">关闭</button></div><p id="notes-item-name"></p><div class="notes-tags"><button type="button" data-note-tag="内片露出" aria-pressed="false">内片露出</button><button type="button" data-note-tag="袖子不贴" aria-pressed="false">袖子不贴</button><button type="button" data-note-tag="基础款" aria-pressed="false">基础款（后面换布料换色等）</button></div><textarea id="notes-text" aria-label="补充备注" maxlength="2000" placeholder="补充备注…"></textarea><div class="notes-footer"><span id="notes-status" role="status"></span><button id="save-notes">保存备注</button></div></dialog><div id="toast" role="status"></div><script src="../print-studio/garment.js"></script><script src="../garment-names.js"></script><script src="../preview-camera.js"></script><script src="mesh.js"></script><script src="eraser.js"></script><script src="openings.js"></script><script src="../garment-body-occlusion.js"></script><script src="../footwear-occlusion.js"></script><script src="../underwear-wardrobe.js"></script><script src="../character-portraits.js"></script><script src="../asset-version.js"></script><script src="../wardrobe-library.js"></script><script>WardrobeLibrary.boot("preppy",["hd-surface.js","studio.js","garment-notes.js","../shoe-config-ui.js"]);</script></body></html>
