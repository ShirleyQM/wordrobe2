<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3fc"><title>词间衣橱</title><link rel="stylesheet" href="style.css"></head>

<div class="app">
 <aside class="sidebar"><a class="brand" href="./"><span class="brand-mark">词</span><span>词间衣橱</span></a><nav><button class="nav active" data-nav="wardrobe">衣橱</button><a class="nav" href="assets/print-studio/index.html">印花 T 恤</a><button class="nav" data-nav="study">学习</button><button class="nav" data-nav="looks">收藏</button></nav><button id="help" class="text-button">玩法</button></aside>
