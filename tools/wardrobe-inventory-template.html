<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>衣服分类目录</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f0eb;color:#403c37;font:14px system-ui,"Microsoft YaHei"}header{background:#fffdf8;padding:26px 30px;border-bottom:1px solid #dfd8ce;position:sticky;top:0;z-index:1}h1{font-size:25px;margin:0 0 12px}p{color:#7c7167;line-height:1.7;margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}input,select,button,.link{font:inherit;border:1px solid #d8d0c4;border-radius:7px;padding:9px 12px;background:#fffdf8;color:inherit}input[type=search]{min-width:250px}button{cursor:pointer}.marked{background:#88683d;color:white}.link{text-decoration:none}#grid{padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}article{background:#fffdf8;border:1px solid #e4ddd4;border-radius:12px;overflow:hidden}figure{height:235px;margin:0;background:repeating-conic-gradient(#f7f5f0 0% 25%,#eeece6 0% 50%) 50%/18px 18px;display:flex;align-items:center;justify-content:center}figure img{width:95%;height:95%;object-fit:contain}.info{padding:14px}h2{font-size:15px;margin:0 0 8px}.id{font-size:11px;color:#8c8277;overflow-wrap:anywhere}.tag{display:inline-block;margin:8px 4px 6px 0;padding:4px 7px;border-radius:5px;background:#efe8dc;font-size:12px}.none{background:#eee;color:#777}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions a{font-size:12px;color:#776040}.actions button{font-size:12px;padding:6px 9px}details{margin-top:10px;font-size:12px}details a{display:block;margin:7px 0;overflow-wrap:anywhere;color:#796950}label{display:flex;align-items:center;gap:6px}#count{font-size:13px}#notice{font-size:12px}@media(max-width:600px){header{padding:16px}#grid{padding:12px;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}figure{height:170px}.info{padding:10px}input[type=search]{min-width:0;width:100%}h1{font-size:21px}}</style>
<header><h1>衣服分类目录</h1><p id="summary"></p><nav><input id="query" type="search" placeholder="搜索名字、稳定 ID、来源或套装"><select id="category" aria-label="类别"><option value="">全部类别</option></select><select id="lineart" aria-label="线稿情况"><option value="">全部线稿情况</option><option>独立原始线稿</option><option>线稿文件（来源待核对）</option><option>仅材质线条层</option><option>未找到线稿</option></select><label><input type="checkbox" id="basic">只看基础款</label><label><input type="checkbox" id="deleted">包含已删除</label><label><input type="checkbox" id="show-lines">预览线稿</label></nav><nav><button id="export">导出当前基础款清单</button><a class="link" href="线稿清单.csv" download>线稿清单 CSV</a><a class="link" id="wardrobe" href="http://127.0.0.1:4173/" target="_blank">打开主衣橱 ↗</a><span id="count"></span></nav><p id="notice">线稿可能来自历史版本；材质线条层与独立原始线稿分开列出。</p></header><main id="grid"></main>
<script>
const inventory=__INVENTORY_DATA__,rows=inventory.items,$=s=>document.querySelector(s),live=/^https?:$/.test(location.protocol),url=p=>p.split('/').map(encodeURIComponent).join('/');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const basicHub=document.createElement('a');basicHub.className='link';basicHub.href='../wardrobe-basics/index.html';basicHub.textContent='基础款体系 ↗';$('#export').before(basicHub);$('#deleted').closest('label').style.display='none';
$('#summary').textContent=`${inventory.summary.total} 个单品 · ${inventory.summary.garments} 件服装 · 独立原始线稿 ${inventory.summary.lineart['独立原始线稿']||0} 款 · 待核对线稿 ${inventory.summary.lineart['线稿文件（来源待核对）']||0} 款 · 仅材质线条层 ${inventory.summary.lineart['仅材质线条层']||0} 款 · 未找到线稿 ${inventory.summary.lineart['未找到线稿']||0} 款`;
for(const cat of Object.keys(inventory.summary.categories).sort()){const o=document.createElement('option');o.value=cat;o.textContent=cat.replace(/^\d+-/,'')+' · '+inventory.summary.categories[cat];$('#category').append(o);}
if(live)$('#wardrobe').href='/';else $('#notice').textContent+=' 当前为文件快照；请在主衣橱标记基础款，或通过本地服务打开此目录。';
function render(){const q=$('#query').value.trim().toLowerCase(),cat=$('#category').value,line=$('#lineart').value,list=rows.filter(r=>(!r.deleted||$('#deleted').checked)&&(!cat||r.category===cat)&&(!line||r.lineartStatus===line)&&(!$('#basic').checked||r.basicTemplate)&&[r.name,r.id,r.sourceCollection,r.matchingSet].join(' ').toLowerCase().includes(q));$('#count').textContent=`显示 ${list.length} / ${rows.length} · 基础款 ${rows.filter(r=>r.basicTemplate&&!r.deleted).length}`;$('#grid').innerHTML=list.map(r=>{const linePreview=r.linearts.find(l=>l.kind==='独立原始线稿')||r.linearts[0],src=$('#show-lines').checked&&linePreview?(linePreview.preview||linePreview.file):r.thumbnail;return `<article><a href="${url(r.image)}" target="_blank"><figure><img loading="lazy" src="${url(src)}" alt="${esc(r.name)}"></figure></a><div class="info"><h2>${esc(r.name)}</h2><div class="id">${esc(r.id)}</div><span class="tag ${r.linearts.length?'':'none'}">${esc(r.lineartStatus)}</span>${r.deleted?'<span class="tag">已删除</span>':''}${r.matchingSet?`<span class="tag">套装 ${esc(r.matchingSet)}</span>`:''}<div class="actions"><button data-basic="${r.id}" class="${r.basicTemplate?'marked':''}" aria-pressed="${!!r.basicTemplate}" ${live&&r.inWardrobe?'':'disabled'}>${r.basicTemplate?'★':'☆'} 基础款</button><a href="${url(r.image)}" target="_blank">当前彩图</a><a href="${url(r.folder+'/来源与线稿.json')}" target="_blank">来源记录</a></div><details><summary>线稿 ${r.linearts.length} 份</summary>${r.linearts.map(l=>`<a href="${url(l.file)}" target="_blank">${esc(l.kind+' · '+l.source.split('/').slice(-2).join('/'))}</a>`).join('')||'<p>尚未找到对应文件，不用去色彩图冒充线稿。</p>'}</details></div></article>`;}).join('');}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));
$('#grid').addEventListener('click',async e=>{const b=e.target.closest('[data-basic]');if(!b)return;const r=rows.find(r=>r.id===b.dataset.basic);b.disabled=true;try{const response=await fetch('/api/garment-basics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:r.id,basic:!r.basicTemplate})}),v=await response.json();if(!response.ok)throw Error(v.error);r.basicTemplate=v.basic;render();}catch(err){$('#notice').textContent='标记未保存：'+err.message;b.disabled=false;}});
async function refreshBasics(){if(!live)return;try{const r=await fetch('/api/garment-basics',{cache:'no-store'});if(!r.ok)throw Error('服务尚未更新');const data=await r.json();for(const row of rows)row.basicTemplate=data.items[row.id]===true;render();}catch(e){$('#notice').textContent='基础款实时状态暂不可用：'+e.message;}}
$('#export').onclick=()=>{const selected=rows.filter(r=>r.basicTemplate&&!r.deleted).map(r=>({...r,diversityBrief:'沿用此款轮廓与关键结构；材质、配色、细节与搭配可派生。生成前目视核对所选线稿和当前彩图。'})),blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),items:selected},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='基础款-diversity清单.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('#query').value=new URLSearchParams(location.search).get('q')||'';
render();refreshBasics();window.addEventListener('focus',refreshBasics);
</script></html>
