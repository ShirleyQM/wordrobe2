<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础款体系 · 衣橱</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2efe9;color:#38342f;font:14px system-ui,"Microsoft YaHei"}header{padding:28px max(24px,calc((100vw - 1500px)/2));background:#fffcf7;border-bottom:1px solid #ded7ca}h1{font-size:28px;margin:0 0 12px}p{line-height:1.8;color:#786e61;margin:8px 0}nav{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}a{color:#80603d}nav a,button,select,input{border:1px solid #d9cebd;background:#fffaf2;border-radius:8px;padding:9px 12px;font:inherit;color:inherit}nav a{text-decoration:none}button{cursor:pointer}.active{background:#765c3b;color:white}.stats{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0 10px}.stats b{font-size:25px;color:#674b2c}.workspace{max-width:1548px;margin:auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:24px}aside{align-self:start;position:sticky;top:16px;background:#fffcf7;border:1px solid #e1d8cb;border-radius:12px;padding:16px}aside h2{font-size:14px;margin:18px 0 10px}aside button{display:block;width:100%;text-align:left;margin:5px 0;font-size:13px}aside span{float:right}#filters{display:flex;gap:8px;flex-wrap:wrap}#query{flex:1;min-width:180px}#status{margin:14px 0;color:#827668}#brief{background:#e8dfd0;padding:14px 18px;border-radius:9px;line-height:1.8;margin-bottom:18px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}article{border:1px solid #e2d9cb;border-radius:12px;overflow:hidden;background:#fffcf7}figure{height:245px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#eee8df 0% 25%,#f5f1e9 0% 50%) 50%/18px 18px;margin:0}figure img{width:92%;height:92%;object-fit:contain}.info{padding:15px}h3{font-size:15px;margin:0 0 8px}.group{font-size:12px;color:#937852;margin-bottom:9px}.tag{display:inline-block;font-size:12px;padding:4px 7px;background:#eee6d9;border-radius:5px;margin:3px 4px 3px 0}.flag{background:#f1e0d2;color:#8b4d35}.note{font-size:12px;line-height:1.7;color:#876340;margin:8px 0}.links{display:flex;gap:12px;margin-top:12px;font-size:12px}details{margin-top:11px;font-size:12px;color:#75695c}details p{font-size:12px}.id{font-size:10px;overflow-wrap:anywhere;color:#9b9184}.empty{padding:40px;text-align:center;color:#8c8171}@media(max-width:850px){.workspace{display:block;padding:14px}aside{position:static;margin-bottom:18px}aside button{width:auto;display:inline-block;margin:4px}aside span{float:none;margin-left:7px}#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}figure{height:190px}.info{padding:10px}header{padding:22px 16px}.stats{gap:15px}}</style>
<header><h1>基础款体系</h1><p>以你标记的基础款为轮廓母版，按款式分组，再用版型松量、袖型和材质定位。已删除条目全部排除。</p><div class="stats" id="stats"></div><p id="coverage"></p><nav><a href="../wardrobe-organized/index.html">全部在库单品</a><a href="/">主衣橱</a><a href="体系清单.json" download>下载体系清单</a><a href="基础款-diversity清单.json" download>下载 diversity 清单</a><button id="family">条纹 Polo 家族</button></nav></header>
<div class="workspace"><aside id="shelves"></aside><main><div id="filters"><input id="query" type="search" placeholder="搜款式、名字、ID 或原备注"><select id="fit" aria-label="版型"><option value="">全部版型</option></select><select id="sleeve" aria-label="袖型"><option value="">全部袖型</option></select><select id="fabric" aria-label="材质"><option value="">全部材质</option></select><label><input type="checkbox" id="flags"> 有其他标记</label></div><div id="status"></div><div id="brief"></div><section id="grid"></section></main></div>
<script>
const data=__BASIC_DATA__,rows=data.items,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),url=p=>p.split('/').map(encodeURIComponent).join('/');let shelf='';
$('#stats').innerHTML=`<div><b>${rows.length}</b> 件基础款</div><div><b>${Object.keys(data.groups).length}</b> 个轮廓分组</div>`+Object.entries(data.roles).map(([r,n])=>`<div>${esc(r)} <b>${n}</b></div>`).join('');
$('#coverage').textContent=data.missingRoles.length?`当前未标记：${data.missingRoles.join('、')}。这些类别不从未标记库存中自动补入。`:'';
$('#shelves').innerHTML='<button data-shelf="" class="active">全部基础款 <span>'+rows.length+'</span></button>'+[...new Set(Object.keys(data.groups).map(g=>g.split('/')[0]))].map(role=>`<h2>${esc(role.replace(/^\d+-/,''))}</h2>`+Object.entries(data.groups).filter(([g])=>g.startsWith(role+'/')).map(([g,n])=>`<button data-shelf="${esc(g)}">${esc(g.split('/')[1].replace(/^\d+-/,''))}<span>${n}</span></button>`).join('')).join('');
for(const key of ['fit','sleeve','fabric'])for(const value of [...new Set(rows.map(r=>r[key]))].sort()){const o=document.createElement('option');o.value=value;o.textContent=value;$('#'+key).append(o);}
function render(){const q=$('#query').value.trim().toLowerCase(),list=rows.filter(r=>(!shelf||r.shelf===shelf)&&['fit','sleeve','fabric'].every(k=>!$('#'+k).value||r[k]===$('#'+k).value)&&(!$('#flags').checked||r.userFlags.length)&&[r.name,r.id,r.shelf,r.variant,r.family,r.userNote,...r.userFlags].join(' ').toLowerCase().includes(q));$('#status').textContent=`显示 ${list.length} / ${rows.length} · 按当前有效彩图归类 · 未改装备槽位`;
$('#brief').textContent=shelf?(rows.find(r=>r.shelf===shelf)?.diversityBrief||''):'先固定各自轮廓与衣片结构，再派生配色、面料和细节。贴身与宽松、常规袖与宽袖分开保留；基础款标记不等于制作验收通过。';
$('#grid').innerHTML=list.map(r=>`<article data-id="${esc(r.id)}"><a href="${url(r.image)}" target="_blank"><figure><img loading="lazy" src="${url(r.thumbnail)}" alt="${esc(r.name)}"></figure></a><div class="info"><div class="group">${esc(r.shelf.split('/')[1].replace(/^\d+-/,''))} · ${esc(r.variant)}</div><h3>${esc(r.name)}</h3><div>${[r.fit,r.sleeve,r.fabric].map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div>${r.userFlags.map(t=>`<span class="tag flag">原标记：${esc(t)}</span>`).join('')}</div>${r.classificationNote?`<p class="note">${esc(r.classificationNote)}</p>`:''}${r.role!==r.slotLabel?`<p class="note">按${esc(r.role)}版型归类；原装备槽仍为${esc(r.slotLabel)}。</p>`:''}${r.userNote?`<p class="note">原备注：${esc(r.userNote)}</p>`:''}<div class="links"><a href="${url(r.image)}" target="_blank">当前彩图</a><a href="${url(r.folder+'/基础款记录.json')}" target="_blank">记录 / 线稿</a></div><details><summary>${esc(r.lineartStatus)} · 派生方向</summary><p>${esc(r.diversityBrief)}</p><p>${esc(r.productionStatus)}</p>${r.linearts.map(l=>`<p><a href="${url(l.file)}" target="_blank">${esc(l.kind)}</a></p>`).join('')}</details><p class="id">${esc(r.id)}</p></div></article>`).join('')||'<div class="empty">没有符合条件的基础款。</div>';}
$('#shelves').onclick=e=>{const b=e.target.closest('[data-shelf]');if(!b)return;shelf=b.dataset.shelf;document.querySelectorAll('[data-shelf]').forEach(x=>x.classList.toggle('active',x===b));render();};
document.querySelectorAll('#filters input,#filters select').forEach(e=>e.addEventListener('input',render));$('#family').onclick=()=>{shelf='';$('#query').value='条纹Polo家族';for(const k of ['fit','sleeve','fabric'])$('#'+k).value='';$('#flags').checked=false;document.querySelectorAll('[data-shelf]').forEach(x=>x.classList.toggle('active',x.dataset.shelf===''));render();};render();
</script></html>
