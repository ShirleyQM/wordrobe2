<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3fc"><title>词间衣橱 · 印花 T 恤</title><link rel="stylesheet" href="print.css"></head><body><header><a href="./">← 衣橱</a><h1>印花 T 恤</h1><button id="save">保存搭配</button></header><main><section class="fitting"><div class="stage-controls"><div class="segmented"><button data-zoom="full" class="active">全身</button><button data-zoom="upper">上半身</button></div><div class="stage-actions"><button id="edit-shape" aria-pressed="false">修版型</button><button id="reset">重置</button></div></div><div id="curve-toolbar" class="curve-toolbar" hidden><label><input id="mirror-shape" type="checkbox" checked> 对称</label><button id="add-shape-node" aria-pressed="false">添加节点</button><button id="undo-shape" disabled>撤销</button><button id="redo-shape" disabled>重做</button><button id="reset-shape">还原本款</button><button id="export-shape">导出版型</button></div><div id="stage" class="stage" tabindex="0" aria-label="温柔的 T 恤试衣预览；拖动图案移动，拉边角缩放，Ctrl 加拖拽自由拉伸"></div><p id="curve-note" class="curve-note" hidden>点击“添加节点”后点轮廓加点；也可双击轮廓。拖蓝点改形，橙柄调弧度。</p><div class="color-row"><span>衣服颜色</span><div id="colors"></div><label class="custom-color">＋<input type="color" id="custom-color" aria-label="自定义衣服颜色"></label></div></section><section class="panel"><div class="styles" id="styles"></div><div class="material-controls"><label>布纹<input id="fabric-texture" type="range" min="0" max="100" value="35"></label><label>褶皱<input id="fabric-folds" type="range" min="0" max="100" value="45"></label></div><div class="pattern-heading"><h2>图案</h2><button id="remove-pattern">纯色</button></div><div class="sources"><button class="active" data-source="all">全部</button><button data-source="pink">花与小动物</button><button data-source="green">植物</button><button data-source="cake">甜点</button></div><div id="patterns" class="patterns"><p class="loading">正在读取图案…</p></div><div class="placement"><span>位置</span><div class="segmented"><button data-placement="center" class="active">居中</button><button data-placement="badge">小胸标</button></div></div><label class="size-control">大小<input id="pattern-scale" type="range" min="20" max="600" value="100"><span id="scale-value">100%</span></label><p class="note">拖动图案移动 · 拉边角缩放 · Ctrl＋拉边角自由拉伸</p></section></main><div id="toast" class="toast" role="status"></div><script src="assets/print-studio/transform.js"></script><script src="assets/print-studio/garment.js"></script><script src="assets/print-studio/fabric.js"></script><script src="print.js"></script></body></html>
