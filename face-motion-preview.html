<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清冷杏眼 · 动态脸</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeae4;color:#303b37;font:16px/1.6 system-ui}main{max-width:1050px;margin:auto;padding:24px 16px}h1{font-size:26px;margin:0}a{color:#38675e}.layout{display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:24px}.portrait{width:100%;height:auto;background:#e8eff9;border-radius:16px}button{font:inherit;padding:8px 12px;margin:4px;border:1px solid #bdc8bf;border-radius:8px;background:#fff;color:inherit;cursor:pointer}button.active{background:#38675e;color:#fff}.controls{padding-top:12px}p{margin:12px 0}.note{color:#6a746d;font-size:14px}@media(max-width:650px){.layout{grid-template-columns:1fr}.portrait{max-width:470px;margin:auto;display:block}}</style>
<main><h1>清冷杏眼 · 动态脸</h1><p>默认使用你选的这张脸。可看自然眨眼、移动鼠标看眼神，也可以逐项检查表情。</p><div class="layout"><canvas class="portrait" id="portrait" width="600" height="720"></canvas><section><p id="status">正在加载动作…</p><div class="controls" id="controls"></div><button id="speech">朗读示范句</button><button id="stop">停止朗读</button><p class="note">口型随朗读播放开合，目前按节奏演示，尚未逐音素对齐。闭眼和口腔仍受模型原始分辨率限制。</p><p><a href="/index.html">打开游戏</a> · <a href="/mobile.html">打开手机版</a></p><p class="note">THA3 标准版 · 预先生成表情，浏览器播放。<a href="https://github.com/pkhungurn/talking-head-anime-3-demo">Pramook Khungurn</a>，模型权重 CC BY 4.0。</p></section></div></main>
<script>window.CharacterPortraits={selected:()=> 'cool'};</script><script src="assets/face-motion.js"></script><script>
const choices=[['自然待机',null],['半闭眼',{blink:.5}],['闭眼',{blink:1}],['看左边',{gaze:-4}],['看右边',{gaze:4}],['微笑',{smile:1}],['抬眉',{brow:1}],['微笑眨眼',{blink:1,smile:1}],...['aaa','iii','uuu','eee','ooo'].map((m,i)=>[['A','I','U','E','O'][i]+' 口型',{mouth:m+'-3'}])];
for(const [label,pose]of choices){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>{FaceMotion.setPose(pose);document.querySelectorAll('#controls button').forEach(x=>x.classList.toggle('active',x===b));});document.querySelector('#controls').append(b);}
const c=document.querySelector('#portrait'),x=c.getContext('2d'),body=new Image();body.src='/assets/materials/characters/clean-body-v4/body-0-0.png?v=neck-join-2';let last=0;
function tick(t){requestAnimationFrame(tick);if(t-last<62||!FaceMotion.status().ready||!body.complete)return;last=t;x.clearRect(0,0,600,720);x.drawImage(body,340,65,270,324,0,0,600,720);x.drawImage(FaceMotion.headCanvas(),(350-340)/270*600,(30-65)/324*720,250/270*600,275/324*720);}requestAnimationFrame(tick);
document.addEventListener('face-motion-ready',()=>document.querySelector('#status').textContent='动作已就绪 · 自然待机中');
document.querySelector('#speech').onclick=()=>{FaceMotion.setPose(null);if(!FaceMotion.speak('Hello! It is a beautiful day. Let us learn something new together.'))document.querySelector('#status').textContent='当前浏览器不支持朗读，可以用口型按钮检查。';};document.querySelector('#stop').onclick=()=>FaceMotion.stopSpeech();
</script></html>
