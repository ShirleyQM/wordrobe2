<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Y2K · 完整学习章节</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html#S04">返回30关图鉴</a><h1>Cyber Y2K</h1><p>记忆里的未来 · 完整学习章节</p><p id="progress" aria-live="polite"></p><small id="storage"></small><nav aria-label="章节导航"><button data-view="map">关卡地图</button><button data-view="words">词本与错题</button><button data-view="cards">我的收藏</button><button data-view="design">完整策划与内容</button></nav></header><main tabindex="-1"></main><noscript>试玩需要启用 JavaScript。可直接查看 <a href="design.md">完整策划说明</a>与 <a href="chapter.json">课文、单词和题目配置</a>。</noscript><footer>三张卡为原创重组设计；品牌系列供参考。课文与题目为原创教学内容，公开文章保留原站链接。存档仅在当前浏览器本地，不上传。</footer><script id="chapter-data" type="application/json">{"id": "y2k-complete-v1", "title": "Cyber Y2K · 记忆里的未来", "audience": "建议 B1 起；B1–B2 的时尚主题阅读原型，尚未进行学习者分级测试。", "minutes": 29, "words": [{"id": "silhouette", "en": "silhouette", "pos": "n.", "zh": "整体廓形", "collocation": "a fitted silhouette", "example": "The boots extend the silhouette.", "translation": "长靴延伸了整体廓形。"}, {"id": "geometric", "en": "geometric", "pos": "adj.", "zh": "几何形的", "collocation": "a geometric neckline", "example": "The neckline follows a geometric curve.", "translation": "领口沿着几何曲线展开。"}, {"id": "metallic", "en": "metallic", "pos": "adj.", "zh": "有金属光泽的", "collocation": "metallic boots", "example": "The metallic boots reflect the light.", "translation": "金属光泽的靴子反射光线。"}, {"id": "translucent", "en": "translucent", "pos": "adj.", "zh": "半透明的", "collocation": "a translucent cape", "example": "The translucent cape softens the outline.", "translation": "半透明肩罩柔化了轮廓。"}, {"id": "structured", "en": "structured", "pos": "adj.", "zh": "有明确结构、挺括的", "collocation": "a structured bodice", "example": "A structured bodice holds its shape.", "translation": "有结构的衣身能够保持形状。"}, {"id": "fitted", "en": "fitted", "pos": "adj.", "zh": "合身贴体的", "collocation": "a fitted dress", "example": "The fitted dress stays close to the body.", "translation": "合身裙贴近身体线条。"}, {"id": "contrast", "en": "contrast", "pos": "n. / v.", "zh": "对比；形成对比", "collocation": "contrast in texture", "example": "There is a contrast between the cape and the boots.", "translation": "肩罩与靴子形成对比。"}, {"id": "texture", "en": "texture", "pos": "n.", "zh": "表面质感；肌理", "collocation": "a rough texture", "example": "Texture changes how a surface looks and feels.", "translation": "肌理影响表面的观感与触感。"}, {"id": "layered", "en": "layered", "pos": "adj.", "zh": "层叠的", "collocation": "a layered outfit", "example": "The layered outfit combines a jacket and a vest.", "translation": "这套层叠造型组合了夹克和背心。"}, {"id": "distressed", "en": "distressed", "pos": "adj.", "zh": "做旧的", "collocation": "distressed denim", "example": "Distressed denim has deliberately worn areas.", "translation": "做旧丹宁带有刻意处理的磨损区域。"}, {"id": "oversized", "en": "oversized", "pos": "adj.", "zh": "宽大廓形的", "collocation": "an oversized jacket", "example": "The oversized jacket adds volume at the shoulders.", "translation": "宽大夹克增加了肩部体积。"}, {"id": "denim", "en": "denim", "pos": "n.", "zh": "牛仔布；丹宁", "collocation": "washed denim", "example": "The jacket and trousers are made of denim.", "translation": "夹克和裤子由丹宁制成。"}, {"id": "hardware", "en": "hardware", "pos": "n.", "zh": "服装金属配件", "collocation": "metal hardware", "example": "The buckle and zip are visible hardware.", "translation": "搭扣和拉链是可见的金属配件。"}, {"id": "washed", "en": "washed", "pos": "adj.", "zh": "经洗水处理的", "collocation": "washed denim", "example": "The washed surface has uneven pale areas.", "translation": "洗水表面有不均匀的浅色区域。"}, {"id": "frayed", "en": "frayed", "pos": "adj.", "zh": "边缘磨散、起毛的", "collocation": "a frayed hem", "example": "A frayed hem has loose threads at its edge.", "translation": "磨散的下摆边缘带有松散线头。"}, {"id": "seam", "en": "seam", "pos": "n.", "zh": "接缝；缝合线", "collocation": "a curved seam", "example": "A curved seam divides the trouser leg.", "translation": "弧形接缝分割裤腿。"}, {"id": "fluid", "en": "fluid", "pos": "adj.", "zh": "流动、柔顺垂坠的", "collocation": "a fluid skirt", "example": "The fluid skirt follows her movement.", "translation": "柔顺裙摆随着动作流动。"}, {"id": "sheer", "en": "sheer", "pos": "adj.", "zh": "轻薄透视的", "collocation": "a sheer sleeve", "example": "The sheer sleeve lets the arm remain visible.", "translation": "轻薄透视的袖子让手臂仍然可见。"}, {"id": "draped", "en": "draped", "pos": "adj.", "zh": "以垂褶塑形的", "collocation": "a draped dress", "example": "Fabric is gathered into a draped shape.", "translation": "布料被收拢成垂褶形状。"}, {"id": "asymmetric", "en": "asymmetric", "pos": "adj.", "zh": "不对称的", "collocation": "an asymmetric hem", "example": "An asymmetric hem is longer on one side.", "translation": "不对称下摆的一侧更长。"}, {"id": "revival", "en": "revival", "pos": "n.", "zh": "再度流行；复兴", "collocation": "a fashion revival", "example": "A revival brings an older style back into use.", "translation": "复兴让过去的风格重新被采用。"}, {"id": "nostalgia", "en": "nostalgia", "pos": "n.", "zh": "怀旧；对过去的眷恋", "collocation": "a sense of nostalgia", "example": "An old music player can create nostalgia.", "translation": "旧音乐播放器能够唤起怀旧情绪。"}, {"id": "iridescent", "en": "iridescent", "pos": "adj.", "zh": "随角度变色、有虹彩的", "collocation": "an iridescent surface", "example": "An iridescent surface shifts in colour as the angle changes.", "translation": "虹彩表面随观看角度改变颜色。"}, {"id": "proportion", "en": "proportion", "pos": "n.", "zh": "比例关系", "collocation": "the proportion of an outfit", "example": "A short jacket changes the proportion of the outfit.", "translation": "短夹克改变整套服装的比例。"}], "texts": [{"id": "t1", "title": "A Future Built from Edges", "title_zh": "用边缘构造未来", "paragraphs": [["P1", "Look first at Orbital Silence, our original card inspired by a Courrèges reference. The white dress has a fitted silhouette, while its high neckline and angular panels give the body a structured outline. The shape does not depend on a large print. Instead, the edges do much of the visual work.", "先看以 Courrèges 为参考设计的原创卡「轨道静默」。白裙廓形贴体，高领与棱角分割构成明确的结构。造型不靠大面积印花，而让边缘承担主要视觉作用。"], ["P2", "Now compare the shoulder cape with the boots. The cape is translucent: light passes through it, and the body remains partly visible. The metallic boots reflect light from a more solid surface. This contrast in texture makes the outfit interesting even though its colours stay close to white, blue and silver.", "再比较肩罩与靴子：肩罩半透明，光线可以穿过，身体仍部分可见；金属光泽的靴子则从更实的表面反光。即使颜色集中在白、蓝、银，质感对比仍让造型有趣。"], ["P3", "Calling the look futuristic is a visual interpretation, not a claim that these clothes contain new technology. The card changes the reference into a short geometric dress and a separate cape. To describe it precisely, name a shape, a material effect and the relationship between them. “Shiny” alone tells us very little.", "“未来感”是视觉判断，不代表衣服含有新科技。卡面将参考转译为几何短裙与独立肩罩。精确描述需要指出形状、材质效果及其关系，只有“闪亮”远远不够。"]], "source_ids": ["courreges"], "kind": "本节原创读图课文；品牌原图供对照", "word_count": 155}, {"id": "t2", "title": "Denim Has More Than One Voice", "title_zh": "丹宁不只有一种声音", "paragraphs": [["P1", "In Distorted Frequency, a cropped jacket and wide trousers create a layered denim outfit. The shoulders look oversized, but the jacket ends above the waist. That short length matters. It keeps the upper half compact while the trousers carry most of the volume. Changing one length can change the proportion of the whole look.", "「失真频段」把短夹克与阔腿裤组合成层叠丹宁。肩部宽大，夹克却在腰线上方结束；上半身因此紧凑，体积主要交给裤子。改变一处长度，就能改变全身比例。"], ["P2", "The washed surface contains pale and dark areas. Curved seams lead the eye down the legs, while metal hardware gives small points of emphasis. A washed effect describes a surface treatment; frayed describes loose threads along an edge. They are related to a worn appearance, but they do not mean the same thing. Do not call every pale patch a hole.", "洗水表面有深浅区域，弧形接缝引导视线向下，金属配件提供小焦点。washed 指表面处理，frayed 指边缘松散线头，二者都可能呈现旧感，但意思不同；浅色斑块不等于破洞。"], ["P3", "The card takes a Diesel reference as a starting point, then changes the jacket length, waist construction and panel lines. Its small music device suggests a personal story. It does not prove that the exact outfit existed in the year 2000. Describe what you can see before giving the clothes a date.", "卡面从 Diesel 参考出发，改变衣长、腰部结构与分割线。小型音乐设备提供故事线索，却不能证明整套衣服真实存在于 2000 年。先描述可见细节，再判断年代。"]], "source_ids": ["diesel"], "kind": "本节原创读图课文；品牌原图供对照", "word_count": 166}, {"id": "t3", "title": "A Softer Version of the Future", "title_zh": "未来也可以柔软", "paragraphs": [["P1", "Liquid Echo offers a different answer to the same theme. Its lilac dress is draped around the body, with an asymmetric hem that extends on one side. A sheer sleeve makes one arm look lighter, while the other side uses an open knitted layer. The outline feels fluid rather than rigid.", "「液态回声」给同一主题另一种答案：淡紫裙以垂褶围绕身体，不对称下摆在一侧延长。一侧透视袖使手臂轻盈，另一侧采用镂空针织层，轮廓流动而非僵硬。"], ["P2", "Metallic platform sandals add weight below the delicate fabric. The background has an iridescent effect, shifting between blue and pink. Be careful with your description: the coloured glass behind the model does not prove that the dress itself changes colour. A scene can suggest a material effect without every garment sharing it.", "金属光泽厚底凉鞋在轻薄裙料下方增加重量。背景在蓝粉之间变色，呈现虹彩效果；但背景玻璃的颜色，不能证明裙子本身也会变色。场景与服装的材质需要分别判断。"], ["P3", "This is an original interpretation developed from a Blumarine reference, not a copied runway look. It uses a softer proportion than the first card and a different surface from the denim outfit. The three cards belong together because they explore a shared idea through different shapes, not because they wear identical colours.", "这套是从 Blumarine 参考发展出的原创转译。它比第一张更柔软，表面也不同于丹宁。三张卡通过不同形状探索同一想法，关联不依赖完全相同的颜色。"]], "source_ids": ["blumarine"], "kind": "本节原创读图课文；品牌原图供对照", "word_count": 155}, {"id": "t4", "title": "The Past Inside the Future", "title_zh": "未来里的过去", "paragraphs": [["P1", "A fashion revival is not a time machine. People can borrow an older visual language while changing the cut, fabric and way an outfit is worn. Nostalgia describes the feeling attached to the past; revival describes a return to popularity. One is an emotion, while the other is a change in fashion.", "时尚复兴不是时光机。人们借用过去的视觉语言，同时改变剪裁、面料与穿法。nostalgia 是对过去的情绪，revival 是重新流行；一个是感受，一个是时尚的变化。"], ["P2", "Our three cards make this distinction useful. Orbital Silence depends on a structured shape and a contrast between translucent and metallic surfaces. Distorted Frequency uses washed denim, curved seams and an oversized upper outline. Liquid Echo replaces that weight with fluid, draped fabric and an asymmetric hem. Their differences are part of the chapter, not mistakes to remove.", "三张卡让这种区别有了具体对象：「轨道静默」依靠结构及半透明与金属表面的对比；「失真频段」使用洗水丹宁、弧形接缝与宽肩；「液态回声」改用流动垂褶与不对称下摆。差别本身就是本节内容。"], ["P3", "Imagine choosing a caption for the collection. “Three silver outfits from 2000” would be inaccurate: the designs are new and the colours differ. A stronger caption would explain how each outfit builds its own version of a remembered future. In fashion English, a convincing interpretation starts with visible evidence and keeps historical claims separate from invented scenes.", "如果为整组写文案，“三套来自 2000 年的银色服装”并不准确：设计是新的，颜色也不同。更好的说明是，每套如何构建记忆中的未来。可靠的时尚表达从可见证据出发，将历史事实与创作场景分开。"]], "source_ids": ["y2k"], "kind": "本节原创比较阅读；公开文章为延伸阅读", "word_count": 166}], "sources": [{"id": "y2k", "brand": "Y2K 背景阅读", "title": "Vogue · Y2K Fashion 101", "url": "https://www.vogue.com/article/y2k-fashion", "note": "延伸阅读；本节课文为原创，不是该文章全文或译文。"}, {"id": "courreges", "brand": "Courrèges", "title": "2024 秋冬官方系列", "url": "https://www.courreges.com/fr/page/collection-fall-winter-2024"}, {"id": "diesel", "brand": "Diesel", "title": "2024 秋冬 · Vogue Runway", "url": "https://www.vogue.com/fashion-shows/fall-2024-ready-to-wear/diesel"}, {"id": "blumarine", "brand": "Blumarine", "title": "2023 春夏 · Vogue Runway", "url": "https://www.vogue.com/fashion-shows/spring-2023-ready-to-wear/blumarine"}], "cards": [{"id": "S04-F01", "title": "轨道静默", "en": "Orbital Silence", "brand": "Courrè
